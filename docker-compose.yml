services:
  web:
    build:
      context: .
      target: runtime
    ports:
      - "8080:80"
    restart: unless-stopped

  dev:
    build:
      context: .
      target: dev
    ports:
      - "3016:3016"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    profiles:
      - dev
